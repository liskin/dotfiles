[settings]
idiomatic_version_file_enable_tools = []
install_before = "7d"
not_found_auto_install = false
paranoid = true
pin = true
trusted_config_paths = ['~/.config/mise/config.toml']

[settings.status]
missing_tools = "always"
show_env = true

[settings.pipx]
uvx = true

[settings.npm]
package_manager = "pnpm"

[settings.github]
credential_command = "gh auth token"

[tools]
"aqua:asciinema/asciinema" = "3.2.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.133"
"cargo:JojiiOfficial/LiveBudsCli" = "rev:4a2d75f5bede545738110dccbac033954b1d6087"
