[settings]
idiomatic_version_file_enable_tools = []
minimum_release_age = "7d"
not_found_auto_install = false
paranoid = [
	'config',
	'env_files',
	'plugins',
]
pin = true
trusted_config_paths = ['~/.config/mise/config.toml']
disable_backends = ['vfox', 'asdf']

[settings.status]
missing_tools = "always"
show_env = true

[settings.cargo]
binstall_quickinstall = true

[settings.pypi]
uvx = true

[settings.npm]
package_manager = "pnpm"

[settings.github]
credential_command = "gh auth token"

[tools]
"aqua:asciinema/asciinema" = "3.2.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
