"cargo:cargo-audit" = "0.22.1"
"cargo:cargo-deny" = "0.19.3"
"cargo:cargo-edit" = "0.13.9"
"cargo:cargo-machete" = "0.9.1"
"cargo:cargo-semver-checks" = "0.47.0"
"cargo:cargo-watch" = "8.5.3"
"cargo:conventional_commits_linter" = "0.17.1"
"cargo:evcxr_repl" = "0.21.1"
"cargo:fclones" = "0.35.0"
"cargo:just-lsp" = "0.4.4"
