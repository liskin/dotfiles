<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<!-- accept Fixed regardless of system-wide no-bitmaps conf -->
	<selectfont>
		<acceptfont>
			<!-- ~/.fonts/Fixed*.otb for pango 1.44+ that can't use old pcf fonts -->
			<pattern><patelt name="family"><string>Fixed</string></patelt></pattern>

			<!-- 7x13.pcf for alacritty etc. -->
			<pattern><patelt name="family"><string>Misc Fixed</string></patelt></pattern>
		</acceptfont>
	</selectfont>

	<!-- Nerd Fonts symbols for Fixed fonts -->
	<alias>
		<family>Fixed</family>
		<accept><family>Symbols Nerd Font Mono</family></accept>
	</alias>
	<alias>
		<family>Misc Fixed</family>
		<accept><family>Symbols Nerd Font Mono</family></accept>
	</alias>
	<alias>
		<family>Iosevka Fixed</family>
		<accept><family>Symbols Nerd Font Mono</family></accept>
	</alias>
	<alias>
		<family>Iosevka Fixed SS18</family>
		<accept><family>Symbols Nerd Font Mono</family></accept>
	</alias>
</fontconfig>
